<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Directive</title>
    <meta
      name="description"
      content="Directive - intelligent work orchestration for Service Operations."
    />
    <!--
      Geist font: this bundle expects the "Geist" / "Geist Mono" families to be
      available. For production, SELF-HOST the Geist woff2 files under
      src/assets/fonts and add @font-face rules to globals.css (recommended for
      an offline Salesforce bundle). For local dev you may instead drop in a CDN
      <link> here. The Tailwind font stack falls back to Inter / system-ui when
      Geist is not present, so the app still renders correctly without it.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
